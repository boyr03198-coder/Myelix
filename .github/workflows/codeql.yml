name: CodeQL

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 3 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  QT_VERSION: ${{ vars.QT_VERSION }}
  QT_HOST: ${{ vars.QT_HOST }}
  QT_TARGET: ${{ vars.QT_TARGET }}
  QT_ARCH: ${{ vars.QT_ARCH }}

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        language:
          - cpp

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.QT_HOST }}
          target: ${{ env.QT_TARGET }}
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Show Qt Version
        shell: cmd
        run: |
          echo Qt Version: %QT_VERSION%

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --fresh --preset vs2022-ci

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset build-ci-debug --config Debug

      - name: Verify Executable
        shell: powershell
        run: |
          $exe = "Build/VS2022/bin/Debug/Myelix.exe"

          if (!(Test-Path $exe)) {
              throw "Build failed. Executable not found: $exe"
          }

          Write-Host "Found $exe"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
